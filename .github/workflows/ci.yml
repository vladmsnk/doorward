name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Module tidiness
        run: make tidy-check

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      # F02: the examples pass validation through the released binary's code path.
      - name: Validate examples
        run: make validate-examples

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  # The release configuration is checked on every change, so a tag never
  # discovers a broken one. Signing needs the tag's OIDC identity and is
  # skipped here.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
