apiVersion: agentbox/v0
kind: Application
metadata:
  name: billing-app
  description: The billing web app, where users start invoice tasks.
spec:
  owner:
    team: billing
    contact: billing-oncall@example.com
  # The app signs its requests to the STS with its own key (RFC 7523).
  authentication:
    method: private_key_jwt
    jwks_uri: https://billing.example.internal/.well-known/jwks.json
  # Users are whoever the company's identity provider says they are.
  users:
    idps: [https://login.example.com]
