apiVersion: agentbox/v0
kind: Agent
metadata:
  name: invoice-assistant
  description: The assistant in the billing app. Pays and inspects invoices for the signed-in user.
spec:
  owner:
    team: payments
    contact: payments-oncall@example.com
  # Its client at the company's identity provider.
  identities:
    - type: jwt
      issuer: https://login.example.com
      subject: 0oa8f2k1LmN3pQ4rS5t6
  task_types: [pay-invoice]
  max_sensitivity: critical
  max_ttl: 30m
  permissions:
    - locations: [https://payments.example.internal]
      actions: [get_invoice, list_payments, pay_invoice]
      constraints:
        /amount: { max: 10000 }
  limits:
    - name: payout-total
      kind: sum
      field: /amount
      max: 10000
