apiVersion: agentbox/v0
kind: Manifest
metadata:
  name: ledger-mcp
  description: The ledger's MCP server. Tool names are the operation names.
spec:
  audience: https://ledger.example.internal/mcp
  protocol: mcp
  operations:
    - name: list_unmatched
      description: Payments of one day that no invoice matches yet.
      sensitivity: read
      params:
        /day: { type: string }

    - name: post_entry
      sensitivity: write
      params:
        /account_id: { type: string }
        /amount: { type: number }
        /memo: { type: string }

    # Critical: money leaves the books, so two people approve the exact call.
    - name: write_off
      sensitivity: critical
      params:
        /payment_id: { type: string }
        /amount: { type: number }
        /reason: { type: string }
