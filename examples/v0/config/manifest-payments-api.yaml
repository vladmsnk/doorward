apiVersion: agentbox/v0
kind: Manifest
metadata:
  name: payments-api
  description: The payments REST API, reachable only through the box's gateway.
spec:
  audience: https://payments.example.internal
  protocol: http
  operations:
    - name: get_invoice
      description: Read one invoice.
      sensitivity: read
      http:
        method: GET
        path: /invoices/{invoice_id}
      params:
        /invoice_id: { type: string, in: path }

    - name: list_payments
      sensitivity: read
      http:
        method: GET
        path: /invoices/{invoice_id}/payments
      params:
        /invoice_id: { type: string, in: path }

    - name: refund_payment
      sensitivity: write
      http:
        method: POST
        path: /payments/{payment_id}/refund
      params:
        /payment_id: { type: string, in: path }
        /amount: { type: number, in: body }

    # Critical: never runs on a standing grant, only on a single-use grant
    # issued after a person approves the exact call. Who approves is up to
    # the mandate: the user, or two people from a group.
    - name: pay_invoice
      sensitivity: critical
      http:
        method: POST
        path: /invoices/{invoice_id}/payments
      params:
        /invoice_id: { type: string, in: path }
        /amount: { type: number, in: body }
        /currency: { type: string, in: body }
