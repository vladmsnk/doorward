apiVersion: agentbox/v0
kind: TaskType
metadata:
  name: pay-invoice
  description: Pay one invoice the user picked in the billing app, by button or by asking the assistant.
spec:
  object:
    type: invoice
    id_pattern: "^inv_[A-Za-z0-9]{6,32}$"
  runs_as: user
  start:
    # A model may propose the task from chat, so the user confirms the
    # exact invoice before anything starts.
    triggers: [ui, chat]
    confirmation: user
  # Only the billing app may start this task; an agent cannot.
  initiators: [billing-app]
  ttl: 15m
  permissions:
    - locations: [https://payments.example.internal]
      actions: [get_invoice, list_payments, pay_invoice]
      constraints:
        # Resolved to `equals: <the invoice ID>` when the grant is issued.
        /invoice_id: { task_object: true }
    - locations: [https://payments.example.internal]
      actions: [pay_invoice]
      constraints:
        /amount: { min: 0.01, max: 5000 }
        /currency: { one_of: [EUR, USD] }
  limits:
    - name: payout-total
      kind: sum
      field: /amount
      actions: [pay_invoice]
      max: 5000
    - name: calls
      kind: count
      max: 50
  # pay_invoice is critical: the user approves each exact payment, signed in
  # within the last five minutes.
  approval:
    required: 1
    approvers: { kind: user }
    max_auth_age: 5m
    expires_after: 30m
