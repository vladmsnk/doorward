version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    errcheck:
      # Writing the CLI's own output to stdout or stderr: there is nothing to
      # do with a failed write.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests read and write their fixtures at paths they build themselves
      # (G304, and its taint-tracking form G703), run tools found on PATH
      # (python3 for the independent journal verifier), and use example
      # credentials such as the demo ledger's key (G101).
      - path: _test\.go
        linters: [gosec]
        text: G304|G703|G204|G101
      # The test helpers read the example documents the same way.
      - path: internal/testhelpers/
        linters: [gosec]
        text: G304

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vladmsnk/doorward
