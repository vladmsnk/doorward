version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    errcheck:
      # Writing the CLI's own output to stdout or stderr: there is nothing to
      # do with a failed write.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests read their fixtures from paths they build themselves, and run
      # tools (python3 for the independent journal verifier) found on PATH.
      - path: _test\.go
        linters: [gosec]
        text: G304|G204

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vladmsnk/doorward
